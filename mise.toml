min_version = "2026.10.25"

[tools]
"aqua:vale-cli/vale" = "3.26.0"

[settings]
lockfile = true
locked = true

[tasks."test:rules"]
description = "Every rule's own cases; every rule must fire in one"
run = "vale test --coverage ProseStyle/styles/ProseStyle"

[tasks."test:package"]
description = "Sync the package into test/ as a project does, then run its project cases"
dir = "test"
run = ["vale sync --plain-progress", "vale test package.test.yml"]

[tasks.test]
description = "Rule cases and package cases"
depends = ["test:rules", "test:package"]

[tasks.build]
description = "ProseStyle.zip from the committed ProseStyle folder"
run = "git archive --format=zip --output=ProseStyle.zip HEAD ProseStyle"
