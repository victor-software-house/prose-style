# Upstream Vale styles that `mise run build` packs into ProseStyle.zip.
# Each release asset is pinned by its sha256, so a moved tag fails the build.
# `styles` names each style folder by its path inside the zip; `legal` names
# files copied into each of those styles, such as a license kept at the zip root.

[[upstream]]
repo = "jdkato/voices"
tag = "v0.2.0"
asset = "Voices.zip"
sha256 = "3d03b911727a502c5a6c1e9ea5c040ebe115cde0f6f99176d116fd6893080ba9"
styles = ["Voices/styles/Voices", "Voices/styles/Direct"]
legal = ["Voices/LICENSE", "Voices/NOTICE"]

[[upstream]]
repo = "vale-cli/Std"
tag = "v0.2.0"
asset = "Std.zip"
sha256 = "8cd785a380f35ed0633e41f157efbb241c7585150552b6e101f5aa5b84576d45"
styles = ["Std"]
legal = []

[[upstream]]
repo = "vale-cli/Readability"
tag = "v0.2.0"
asset = "Readability.zip"
sha256 = "cf8790677bb2ef86458c1d1dbd6e646fd8063c0e9621f81141e5cd85e5e41f81"
styles = ["Readability"]
legal = []
