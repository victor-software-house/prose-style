# A consumer of the pull request package, as the organization's pull request
# check reads it: the frozen v0.0.14 ProseStyle zip, which still holds the
# Vale package and the Voices and Direct styles, then PullRequestStyle.zip as
# `mise run build` writes it. vale sync runs from this folder.
StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/victor-software-house/prose-style/releases/download/v0.0.14/ProseStyle.zip, ../../PullRequestStyle.zip
