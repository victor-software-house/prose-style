# Project cases: linted through the built ProseStyle.zip, the way a project
# that names the release runs.
- name: every enabled style reaches a Markdown file
  input: |
    The blocker is load-bearing — so we wait, e.g. a day.

    Each user should check his/her settings.

    One two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty twenty one twenty two twenty three twenty four twenty five twenty six.
  contains:
    - ProseStyle.StockPhrases
    - ProseStyle.Dashes
    - Std.Abbreviations.Latin
    - Direct.Length
- name: a label and a colon passes
  about: Voices.ColonReveal fires on this line when it is on.
  input: |
    The cause: the socket closed mid-body.
  absent: Voices.ColonReveal
- name: short everyday prose passes
  input: |
    The worker reads the cache.  
    It holds one file per session.
  want: ''
- name: the Voices style runs
  input: |
    We make a decision each week.
  contains:
    - Voices.WeakVerbs
- name: a Rust doc comment is Markdown
  format: .rs
  input: |
    /// The blocker is load-bearing, e.g. a day.
    fn wait() {}
  contains:
    - ProseStyle.StockPhrases
    - Std.Abbreviations.Latin
- name: reading ease stays off in Rust
  about: Direct.Ease fires on one-line paragraphs when it is on.
  format: .rs
  input: |
    /// Closes the socket.
    fn close() {}
  want: ''
- name: a text file is not prose
  format: .txt
  input: |
    The blocker is load-bearing — so we wait.
  want: ''
- name: inline code in a Rust doc comment passes
  about: Without rs = md, Vale reads the comment as plain text and flags the code.
  format: .rs
  input: |
    /// The `load-bearing` flag.
    fn flag() {}
  want: ''
- name: harness as a noun passes
  about: Voices.Banned flags harness; the package vocabulary accepts the noun.
  input: |
    The freshness harness reads stdout.  
    Run the measurement harnesses.
  want: ''
- name: harness as a verb fails
  input: |
    They harnessed the cache. We are harnessing it.
  contains:
    - Voices.Banned
- name: a URL in a Rust string literal passes
  about: The shapes verctl reported, in a formatdoc! output, an indoc! error sample and an indoc! YAML fixture.
  format: .rs
  input: |
    fn expected() -> String {
        formatdoc! {"
            Published to the registry.
              base: https://example.test/v1
        "}
    }

    const SAMPLE: &str = indoc! {"
        error: the registry at https://crates.io refused the upload
    "};

    const FIXTURE: &str = indoc! {r#"
        registries:
          internal:
            index: sparse+https://registry.example.com/index/
    "#};
  want: ''
- name: a bare URL in a Rust comment fails once
  format: .rs
  input: |
    /// Read https://doc.example first.
    fn read() {}
  contains:
    - ProseStyle.BareURLInComment
  absent:
    - "ProseStyle.BareURL:"
- name: a bare URL in Markdown fails through BareURL
  input: |
    Read https://doc.example first.
  contains:
    - ProseStyle.BareURL
  absent:
    - ProseStyle.BareURLInComment
- name: a code in a Rust string literal passes
  format: .rs
  input: |
    const SAMPLE: &str = indoc! {"
        error: ticket EVO-9673 is closed, see #123
    "};
  want: ''
- name: a bare code in a Rust comment fails once
  format: .rs
  input: |
    /// Fixed in EVO-9673.
    fn fix() {}
  contains:
    - ProseStyle.BareWorkItemInComment
  absent:
    - "ProseStyle.BareWorkItem:"
- name: a bare code in Markdown fails through BareWorkItem
  input: |
    Fixed in EVO-9673.
  contains:
    - "ProseStyle.BareWorkItem:"
  absent:
    - ProseStyle.BareWorkItemInComment
