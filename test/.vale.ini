# A consumer project for the package cases. vale sync runs from this folder
# and unpacks the zips `mise run build` writes, as a project unpacks a release.
# PullRequestStyle reads only the .pr-title and .pr-body files the pull request
# check writes, so the Markdown and Rust cases see ProseStyle alone.
StylesPath = styles
MinAlertLevel = suggestion
Packages = ../ProseStyle.zip, ../PullRequestStyle.zip
