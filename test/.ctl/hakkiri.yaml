# This is a sample project for the package cases.
# `mise run test:package` unpacks the zip from `mise run build` into `package/`, as a project unpacks a release.
# It then lists the styles folder, and hakkiri reads the package settings next to it.
packages:
  - path: package/ProseStyle/styles
files:
  # The package settings turn PassiveVoice off. A glob of the project wins.
  '*.rs':
    ProseStyle.PassiveVoice: on
