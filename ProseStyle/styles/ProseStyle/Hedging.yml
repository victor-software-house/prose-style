extends: existence
message: "Cut the hedge '%s'."
level: error
ignorecase: true
tokens:
  - '(?:you )?may want to(?: consider)?'
  - is likely because
  - "it(?:'s| is) worth noting"
  - "it(?:'s| is) important to note"
  - "one could argue"

tests:
  - name: fires
    input: |
      It's worth noting that this works.
    want: |
      1:1:ProseStyle.Hedging:Cut the hedge 'It's worth noting'.
  - name: clean
    input: |
      This works.
    want: ""
