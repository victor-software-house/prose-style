# Stock phrases that stand in for a real explanation. Say what actually happens.
extends: existence
message: "Stock phrase '%s': say what actually happens."
level: error
ignorecase: true
tokens:
  - 'load[- ]bearing'
  - 'harness(?:es)? the (?:full )?(?:power|potential)'
  - non-trivial
  - crucially
  - at its core
  - smoking gun
  - circle back
  - where it gets proven
  - one liberty
  - shielded from
  - 'carries the (?:\w+ )?proof'
  - the intended trade
  - "(?:my )?honest opinion"
  - I have the full picture
  - "you're right to push back"
  - shapes the entire
  - tinkerer
  - mannered
tests:
  - name: flags stock phrases
    input: The lock is load-bearing. Crucially, the fix is non-trivial.
    contains:
      - "'load-bearing'"
      - "'Crucially'"
      - "'non-trivial'"
  - name: flags the verb harness before power
    input: We harness the power of the cache.
    contains:
      - "'harness the power'"
  - name: leaves a mechanism alone
    input: The lock keeps two writers from the same file.
    want: ''
