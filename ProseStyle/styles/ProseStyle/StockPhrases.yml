# Stock phrases that stand in for a real explanation. Write the concrete action or result instead.
extends: existence
message: "Stock phrase '%s': write the concrete action or result it stands for."
level: error
ignorecase: true
tokens:
  - 'load[- ]bearing'
  - non-trivial
  - crucially
  - at its core
  - smoking gun
  - circle back
  - where it gets proven
  - one liberty
  - shielded from
  - 'carries the (?:\w+ )?proof'
  - the intended trade
  - "(?:my )?honest opinion"
  - I have the full picture
  - "you're right to push back"
  - shapes the entire
  - tinkerer
  - mannered
  - deep dive
  - just say the word
tests:
  - name: flags stock phrases
    input: The lock is load-bearing. Crucially, the fix is non-trivial.
    contains:
      - "'load-bearing'"
      - "'Crucially'"
      - "'non-trivial'"
  - name: leaves harness the power to SlopWords
    input: We harness the power of the cache.
    want: ''
  - name: leaves a mechanism alone
    input: The lock keeps two writers from the same file.
    want: ''
  - name: flags deep dive and just say the word
    input: A deep dive into the log. Just say the word.
    contains:
      - "'deep dive'"
      - "'Just say the word'"
