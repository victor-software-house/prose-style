extends: existence
message: "Write the date '%s' in the form 2026-11-18."
level: suggestion
ignorecase: true
nonword: true
tokens:
  - '\d{1,2}(?:\.|/)\d{1,2}(?:\.|/)\d{4}'
  - '\d{1,2} (?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?) \d{4}'
tests:
  - name: fires
    input: >
      Support ends on 12/31/2026, which was announced on 5 January 2026.
    want: |
      1:17:ProseStyle.DateFormat:Write the date '12/31/2026' in the form 2026-11-18.
      1:52:ProseStyle.DateFormat:Write the date '5 January 2026' in the form 2026-11-18.

  - name: clean
    input: >
      Support ends on December 31, 2026.
    want: ""
