#
# Each inflection has its own replacement, so the fix matches the tense and number.
# For example, `make a decision` becomes `decide`, and `made a decision` becomes `decided`.
# The phrase `was able to` is left alone.
# It often marks one outcome that was reached, where `could` would change the meaning.
extends: substitution
message: "Write '%s' instead of '%s'."
level: error
ignorecase: true
capitalize: true
action:
  name: replace
swap:
  make a decision: decide
  makes a decision: decides
  made a decision: decided
  making a decision: deciding
  has the ability to: can
  have the ability to: can
  had the ability to: could
  is able to: can
  are able to: can
  in order to: to

tests:
  - name: fires
    input: |
      We made a decision to ship.
    want: |
      1:4:ProseStyle.WeakVerbs:Write 'decided' instead of 'made a decision'.
  - name: agrees in tense
    input: |
      We make a decision each week.
    want: |
      1:4:ProseStyle.WeakVerbs:Write 'decide' instead of 'make a decision'.
  - name: keeps the case
    input: |
      Making a decision takes time.
    want: |
      1:1:ProseStyle.WeakVerbs:Write 'Deciding' instead of 'Making a decision'.
  - name: clean
    input: |
      We decided to ship.
    want: ""
