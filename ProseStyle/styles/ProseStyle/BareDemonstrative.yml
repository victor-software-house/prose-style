# "This is ..." and "That means ..." at the start of a sentence leave the reader
# to find what the word points to. Put a noun after it. A bare "it" is not
# checked: it opens too many correct sentences in technical prose.
# Source: Google developer documentation style guide, word list, "this, that":
# "Where possible, put a noun after this or that for clarity."
extends: sequence
message: "'%[1]s %[2]s': add the noun it points to."
level: suggestion
ignorecase: true
tokens:
  - negate: true
    pattern: \S+
  - pattern: this|that|these|those
  - tag: VB|VBD|VBG|VBN|VBP|VBZ|MD
tests:
  - name: flags this or that with no noun
    input: >
      The build fails. This is why the cache is cold. That means a retry.
    contains:
      - "'This is'"
      - "'That means'"
  - name: leaves a demonstrative with a noun, and one mid-sentence
    input: >
      This change is why the cache is cold. That retry fixes it. The fix in
      PR #123 handles this. Use `this` in `src/self.rs`.
    want: ''
