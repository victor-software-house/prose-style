# BareWorkItem for Rust: a bare code in a comment names nothing a reader
# knows, and a code in a string literal or macro body is data.
# Raw scope sees the whole file, so the lookbehind keeps a code that follows
# // on its line, follows /* on its line, or sits up to 50 lines below a line
# that opens with /*, as BareURLInComment does.
# That lookbehind scans back up to 50 lines, so the lookahead in front runs
# it only where a code starts, not at every capital letter. It reads a
# comment as runs of characters other than *, so a line of thousands of
# characters stays within regexp2's backtracking stack.
# The rest matches BareWorkItem: a code in link text or backticks, and a
# standard name such as SHA-256, passes.
extends: existence
message: "'%s' is a bare code: say what it is, and link it."
level: warning
scope: raw.rs
nonword: true
tokens:
  - '(?=(?:#\d{2,5}|![1-9]\d{1,4}|[A-Z][A-Z0-9]{1,6}-\d{2,5})(?![\w\]`-]))(?<![\[\w/`#&-])(?!(?:SHA|UTF|ISO|RFC|CVE|AES|TLS|HTTP|IPv|W)-)(?<=(?<![:/])//[^\n]*|(?<!\S)/\*[*!]?[ \t][^\n*]*(?:\*(?!/)[^\n*]*)*|(?:\A|\n)[ \t]*/\*[*!]?(?=\s)[^\n*]*(?:\*(?!/)[^\n*]*)*\n(?:[^\n*]*(?:\*(?!/)[^\n*]*)*\n){0,50}[^\n*]*(?:\*(?!/)[^\n*]*)*)(?:#\d{2,5}|![1-9]\d{1,4}|[A-Z][A-Z0-9]{1,6}-\d{2,5})(?![\w\]`-])'
tests:
  - name: flags a bare code in each kind of comment
    format: rs
    input: |
      //! Started in EVO-9673.

      /// Fixed in PR #123.
      fn f() {
          // See !294 first.
          let d = 1; // trailing QCTL-006
          /* Block comment ABC-12 */
          /*
           * Spans lines #456
           */
      }
    contains:
      - "'EVO-9673'"
      - "'#123'"
      - "'!294'"
      - "'QCTL-006'"
      - "'ABC-12'"
      - "'#456'"
  - name: leaves codes in links and backticks, and standard names, in comments
    format: rs
    input: |
      /// Use `QCTL-006`, [PR 40](https://example.com/pull/40), SHA-256 and UTF-8.
      fn f() {}
    want: ''
  - name: leaves string literals, raw strings and macro bodies alone
    format: rs
    input: |
      fn expected() -> String {
          formatdoc! {"
              Closed #123 and ABC-12.
          "}
      }

      const SAMPLE: &str = indoc! {"
          error: ticket EVO-9673 is closed
      "};

      const FIXTURE: &str = indoc! {r#"
          ledger:
            - id: QCTL-006
              merge: !294
      "#};

      const PLAIN: &str = "see #456";
      const RAW: &str = r#"see ABC-34"#;
    want: ''
  - name: runs on Rust files only
    about: The scope raw.rs keeps Markdown to BareWorkItem.
    input: |
      // See EVO-9673.
    want: ''
