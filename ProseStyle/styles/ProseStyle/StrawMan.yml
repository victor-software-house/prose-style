# "X, not Y" and "not because X, but Y" frame a claim against a straw man.
# Voices.BinaryContrast covers "is not X, it's Y".
extends: existence
message: "Straw-man contrast '%s': make the claim directly."
level: suggestion
ignorecase: true
nonword: true
tokens:
  - '\b(?:is|are|was) (?:an?|the) [^\n,.;:]{1,30}, not (?:an?|the) [^\n,.;:]{1,30}[.;]'
  - '\bnot because [^\n,.;]{1,40}[,;] but\b'
tests:
  - name: flags both shapes
    input: A reply is a document, not a transcript. Not because it is slow, but because it is wrong.
    contains:
      - "'is a document, not a transcript.'"
      - "'Not because it is slow, but'"
  - name: leaves a direct claim alone
    input: A reply is a document.
    want: ''
