# "Kind" as a category label hides what varies. Natural uses such as
# "the same kind of" and "three kinds of" pass. Code spans are skipped.
extends: existence
message: "'%s': name what varies (record type, body type, column, group), not 'kind'."
level: warning
ignorecase: true
tokens:
  - '(?:each|every|per|by|one|this|that|its|their|the|a|an|new|unknown|record|body|which) kinds?'
exceptions:
  - '(?:the same|what|which|any|another|some|this|that|one|two|three|four|several|many|other|every|each|a|the) kinds? of'
tests:
  - name: flags kind as a label
    input: |
      Map each kind with `match`.

      An unknown kind refuses the whole body.

      The answer counts rows per kind.
    contains:
      - "'each kind'"
      - "'unknown kind'"
      - "'per kind'"
  - name: leaves natural uses alone
    input: |
      Look for the same kind of repeat in the log.

      Three kinds of row go in one body.

      Say what kind of input it was.

      Use the `kind` field.
    want: ''
