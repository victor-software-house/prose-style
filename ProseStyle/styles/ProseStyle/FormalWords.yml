# Everyday words over formal ones. InflatedWords covers utilize,
# leverage and facilitate.
extends: substitution
message: "Formal word: use '%s' instead of '%s'."
level: error
ignorecase: true
swap:
  prior to: before
  subsequently: then|later
  approximately: about
  commenc(?:e|es|ed|ing): start
  in the event that: if
  numerous: many
  sufficient: enough
  assist(?:s|ed|ing)?: help
  obtain(?:s|ed|ing)?: get
  serves as: is
  stands as(?! a testament): is
  functions as: is
  boasts: has
tests:
  - name: flags formal words
    input: Prior to the run, obtain the token. The page serves as the index.
    contains:
      - "'Prior to'"
      - "'obtain'"
      - "'serves as'"
  - name: leaves everyday words alone
    input: Before the run, get the token. The page is the index.
    want: ''
