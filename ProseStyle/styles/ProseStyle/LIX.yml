# Derived from `errata-ai/Readability` (MIT). See `NOTICE`.
# Off until a project turns it on.
extends: metric
message: "Readability index (LIX) %s is over 35: use shorter sentences and words."

link: https://en.wikipedia.org/wiki/Lix_(readability_test)
# The score bands, with the names the original scale gives them:
#
# - 20 to 25: `Very Easy`
# - 30 to 35: `Easy`
# - 40 to 45: `Medium`
# - 50 to 55: `Difficult`
# - 60 and over: `Very Difficult`
formula: |
  (words / sentences) + ((long_words * 100) / words)

condition: "> 35"
tests:
  - name: fires on a hard text
    input: >
      Notwithstanding the aforementioned considerations, the organization's interdepartmental reorganization initiative necessitated comprehensive reevaluation of institutional methodologies.
    contains: "Readability index (LIX) 95.00 is over 35: use shorter sentences and words."
  - name: leaves a plain text alone
    input: The cat sat on the mat.
    want: ""
