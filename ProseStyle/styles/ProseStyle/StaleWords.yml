# A document states what is true now. Words that narrate history go stale.
# "No longer", "recently" and "newly" date the text the same way. "No longer than" passes.
extends: existence
message: "'%s' narrates history or goes stale: state what is true."
level: warning
ignorecase: true
exceptions:
  - no longer than
tokens:
  - currently
  - no longer
  - recently
  - newly
  - previously
  - formerly
  - used to
  - as of now
  - 'now (?:uses|reads|writes|has|takes|runs|keeps)'
  - '(?:was|were|has been|have been) (?:renamed|replaced|moved|removed|dropped)'
tests:
  - name: flags narration
    input: This tool currently uses the cache, which was renamed last week. It now reads the lock.
    contains:
      - "'currently'"
      - "'was renamed'"
      - "'now reads'"
  - name: leaves present facts alone
    input: The tool reads the cache. Files missing from disk are skipped.
    want: ''
  - name: flags no longer and recently
    input: The flag is no longer needed. A recently added field is newly public.
    contains:
      - "'no longer'"
      - "'recently'"
      - "'newly'"
  - name: leaves no longer than alone
    input: Keep the line no longer than 80 columns.
    want: ''
