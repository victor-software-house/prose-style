# Copyright (c) 2026 Peter Yang, licensed under the MIT License. See `NOTICE`.
#
# This rule covers the half of the inflated vocabulary that has one right answer.
# A `substitution` rule carries `action: replace` and the exact span.
# So an agent applies these fixes without spending a turn on a choice, and the alert costs nothing to act on.
#
# `Banned` keeps the rest.
# Words such as `delve`, `harness` and `paradigm shift` need a rewrite, since a plain swap does not work.
# A fix applied without thought has to be right every time, or it is worse than no fix at all.
extends: substitution
message: "Write '%s' instead of '%s'."
level: error
ignorecase: true
# The fix keeps the matched word's case.
# So `Utilize` at the start of a sentence becomes `Use` with a capital.
capitalize: true
action:
  name: replace
# The verbs carry their inflections, each with its own replacement.
# A fix applied without thought has to agree in tense, or `leveraging` would come back as `use`.
swap:
  utilize: use
  utilizes: uses
  utilized: used
  utilizing: using
  leverage: use
  leverages: uses
  leveraged: used
  leveraging: using
  facilitate: help
  facilitates: helps
  facilitated: helped
  facilitating: helping
  streamline: simplify
  streamlines: simplifies
  streamlined: simplified
  streamlining: simplifying
  elevate: raise
  elevates: raises
  elevated: raised
  elevating: raising
  supercharge: speed up
  supercharges: speeds up
  supercharged: sped up
  supercharging: speeding up
  robust: strong
  meticulous: careful
  intricate: complex

tests:
  - name: fires
    input: |
      We utilize caching.
    want: |
      1:4:ProseStyle.InflatedWords:Write 'use' instead of 'utilize'.
  - name: keeps the case
    input: |
      Utilize caching.
    want: |
      1:1:ProseStyle.InflatedWords:Write 'Use' instead of 'Utilize'.
  - name: clean
    input: |
      We use caching.
    want: ""