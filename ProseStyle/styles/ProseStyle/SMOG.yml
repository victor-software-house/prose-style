# Derived from errata-ai/Readability (MIT). See NOTICE.
# Off until a project turns it on.
extends: metric
message: "Try to keep the Simple Measure of Gobbledygook (SMOG) grade (%s) below 10."
link: https://en.wikipedia.org/wiki/SMOG

formula: |
  1.0430 * math.sqrt((polysyllabic_words * 30.0) / sentences) + 3.1291

condition: "> 10"
tests:
  - name: fires on a hard text
    input: >
      Notwithstanding the aforementioned considerations, the organization's interdepartmental reorganization initiative necessitated comprehensive reevaluation of institutional methodologies.
    contains: (SMOG) grade
  - name: leaves a plain text alone
    input: The cat sat on the mat.
    want: ""
