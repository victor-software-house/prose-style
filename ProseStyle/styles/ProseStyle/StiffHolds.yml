# The verb `holds` for what a file, field or program contains is stiff, and agents use it too much.
# People write contains, stores or has.
extends: existence
message: "Write contains, stores or has instead of '%s'."
level: error
ignorecase: true
tokens:
  - '(?<!\bsame )\bholds\b(?![.;]|,? (?:for|if|when|because|unless|as long as|so that)\b|, (?:so|and|but|or)\b| (?:a |an |the )?(?:\w+[- ]){0,2}(?:lock|locks|mutex|latch)\b| true\b)'
  - '\bwhat (?:the |a |an |this |its )?\w+ holds\b'
  - '\bholding\b(?! (?:down|the \w+ key|(?:a |an |the )?(?:\w+[- ]){0,2}(?:lock|locks|mutex|latch))\b)'
tests:
  - name: flags holds for what a thing contains
    input: |
      The vault holds only SSH keys. A table holding the rows.
      The vault holds: keys. Check what the vault holds. The vault holds so many keys.
    contains:
      - "'holds'"
      - "'holding'"
      - "'what the vault holds'"
  - name: leaves plain verbs and holding a key down alone
    input: The vault contains only SSH keys. Press Shift while holding down Option.
    want: ''
  - name: leaves locks and claims that hold alone
    input: |
      The thread holds an exclusive lock while holding a write lock. The invariant holds for every input.
      It holds true. The invariant holds, so the loop ends. The claim holds if the cache is warm.
      The claim holds, but only for warm caches. It holds a read-write lock while holding an exclusive write lock.
    want: ''
