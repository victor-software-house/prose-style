extends: existence
message: "Cut the recap '%s'."
level: error
ignorecase: true
nonword: true
tokens:
  - '(?m)^(?:In conclusion|Ultimately|Overall)\b'

tests:
  - name: fires
    input: |
      In conclusion, it works.
    want: |
      1:1:ProseStyle.RecapOpener:Cut the recap 'In conclusion'.
  - name: clean
    input: |
      It works.
    want: ""
