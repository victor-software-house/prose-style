# A word of four or more hyphen-joined parts is a coinage, or a file name in running prose.
# Agent docs use these 9 times as often as human design docs. Put a file name in a code span.
# A part of a path or a dated file name, such as decisions/2026-11-01-a-b-c-d.md, passes.
extends: existence
message: "'%s' joins four words with hyphens: say it in plain words, or put a file name in a code span."
level: error
nonword: true
exceptions:
  - end-to-end-\w+
  - state-of-the-art
  - up-to-date
  - man-in-the-middle
  - read-modify-write
  - ahead-of-time
  - just-in-time
  - run-to-completion
tokens:
  - '(?<![\w/.-])[A-Za-z][a-z]*(?:-[a-z]+){3,}\b'
tests:
  - name: flags four hyphen-joined words
    input: The top-to-bottom-reading-order check and a claude-code-source-recovery note. Left-to-right-reading-order fails too.
    contains:
      - "'top-to-bottom-reading-order'"
      - "'claude-code-source-recovery'"
      - "'Left-to-right-reading-order'"
  - name: leaves short compounds and real phrases alone
    input: >
      An end-to-end test of a read-only view, a state-of-the-art tool and an
      up-to-date copy. The `pre-release-format-changes` file stays.
      [writer]: ../decisions/2026-11-01-recorder-writer-fixed-chunks.md
    want: ''
