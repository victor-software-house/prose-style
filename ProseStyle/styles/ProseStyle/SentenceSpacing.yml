# Taken from `errata-ai/Microsoft` (MIT). See `NOTICE`.
#
# It uses Microsoft's token set.
# The full stop case needs a word that starts in lowercase, so dotted identifiers such as `System.Text.Json` pass.
# A `?` or a `!` never occurs in an identifier, so those cases match any word.
extends: existence
message: "Use one space between sentences."
level: suggestion
nonword: true
tokens:
  - '[a-z][.?!] {2,}[A-Z]'
  - '\b[a-z]\w*\.[A-Z]'
  - '\w[?!][A-Z]'
tests:
  - name: fires
    input: >
      Restart the host.Then check the logs.  Every time!Always.
    want: |
      1:13:ProseStyle.SentenceSpacing:Use one space between sentences.
      1:36:ProseStyle.SentenceSpacing:Use one space between sentences.
      1:49:ProseStyle.SentenceSpacing:Use one space between sentences.

  - name: clean
    input: >
      Restart the host. Then check the logs.
    want: ""
