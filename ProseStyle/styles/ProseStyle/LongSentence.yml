# One idea per sentence. Direct.Length warns at 25 words; this fails at 40.
extends: occurrence
message: "Sentence runs to %d words. Split it: one idea per sentence."
level: error
scope: sentence
max: 40
token: \b(\w+)\b
tests:
  - name: flags a sentence over 40 words
    input: >
      One two three four five six seven eight nine ten eleven twelve thirteen
      fourteen fifteen sixteen seventeen eighteen nineteen twenty twenty-one
      twenty-two twenty-three twenty-four twenty-five twenty-six twenty-seven
      twenty-eight twenty-nine thirty and more words keep coming past the limit.
    contains: ProseStyle.LongSentence
  - name: leaves a short sentence alone
    input: One idea fits in one sentence.
    want: ''
