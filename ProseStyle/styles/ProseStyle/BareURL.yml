# A bare URL shows the reader an address in place of a name.
# The rule reads the link scope, where a URL written bare, an autolink and a
# link whose text is its URL show as a link whose text starts with http. A
# link with words as text, a URL in a code span or a fenced block, a link
# target and a reference definition never reach that scope, so a command in a
# code block keeps its literal URL. The earlier pattern looked behind each URL
# for fences and code spans and ran out of backtracking steps on long files.
extends: existence
message: "Bare URL '%s': put the link on the words that name it."
level: error
scope: link
nonword: true
raw:
  - '^https?://\S+$'
tests:
  - name: flags a bare URL and an autolink
    input: See https://example.com/x here, and <https://auto.example>.
    contains:
      - "'https://example.com/x'"
      - "'https://auto.example'"
  - name: leaves links, definitions and code alone
    input: |
      See [the page](https://ok.example) and `https://code.example`.

      [ref]: https://def.example

      ```ini
      Packages = https://pkg.example/A.zip
      ```
    want: ''
  - name: leaves a command URL in a fenced block alone
    input: |
      # Install

      ```sh
      curl -fsSL https://mise.run | sh
      ```

      1. Run it.

         ```sh
         curl https://list.example | sh
         ```

      ~~~text
      https://tilde.example
      ~~~
    want: ''
  - name: flags a bare URL after a closed fence
    input: |
      ```sh
      curl https://inside.example
      ```

      Then read https://after.example now.
    contains:
      - "'https://after.example'"
    absent:
      - "inside.example"
  - name: leaves a URL inside a code span after other words alone
    input: |
      Run `curl https://code.example/x` or `GET https://api.example/v1` first.

      | Endpoint | Use |
      |:--|:--|
      | `POST https://table.example/batch` | events |
    want: ''
  - name: flags a bare URL after a closed code span
    input: Run `make` and then open https://after-span.example today.
    contains:
      - "'https://after-span.example'"
  - name: leaves a URL inside a double-backtick span alone
    input: Run ``curl https://double.example/x`` first.
    want: ''
  - name: flags a bare URL after a closed double-backtick span
    input: Run ``make`` and then open https://after-double.example today.
    contains:
      - "'https://after-double.example'"
  - name: pairs backtick runs by length as CommonMark does
    input: |
      Run ``a ` b https://pair.example`` now.

      A lone `` stray then `curl https://after-stray.example` now.
    want: ''
  - name: flags a bare URL after a backtick that opens no span
    input: |
      The ` key then https://lone.example now.

      An escaped \` then https://escaped.example now.

      A span `C:\` then https://backslash.example now.
    contains:
      - "'https://lone.example'"
      - "'https://escaped.example'"
      - "'https://backslash.example'"
