# Chat replies leaked into a document: echoes, praise and offers.
# Cut them.
extends: existence
message: "Leaked chat '%s': cut it."
level: error
ignorecase: true
tokens:
  - "you're (?:absolutely |completely )?right"
  - good catch
  - good point
  - great question
  - 'as you (?:said|mentioned|noted|asked|pointed out)'
  - want me to
  - would you like me to
  - 'should I (?:continue|proceed|go ahead)'
  - "if you're aware of that"
tests:
  - name: flags an echo and an offer
    input: You're right that it fails. Want me to fix it?
    contains:
      - "'You're right'"
      - "'Want me to'"
  - name: leaves a statement of fact alone
    input: The run fails on the second step.
    want: ''
  - name: flags good point
    input: Good point, the cache is cold.
    contains: "'Good point'"
