# A compound coined from a hyphen chain: one carrying "versus", or turned
# into a noun with -ness or -ity. Plain hyphen chains are mostly real names.
extends: existence
message: "'%s' is a coined compound: say it in plain words."
level: warning
ignorecase: true
nonword: true
tokens:
  - '\b[a-z]+(?:-[a-z]+)*-(?:versus|vs)-[a-z]+(?:-[a-z]+)*\b'
  - '\b[a-z]+(?:-[a-z]+)+(?:ness|ity)\b'
tests:
  - name: flags coined compounds
    input: A top-to-bottomness check and a bullets-versus-numbered-paragraphs rule.
    contains:
      - "'top-to-bottomness'"
      - "'bullets-versus-numbered-paragraphs'"
  - name: leaves real compounds alone
    input: End-to-end tests and a read-only view stay.
    want: ''
