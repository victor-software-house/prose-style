# A degree adverb before a verb ("heavily rely", "greatly improve") asks the
# verb to do more than it can. Pick a stronger verb ("depend", "speed up").
# The list holds degree adverbs only. Adverbs of manner such as "correctly" or
# "safely" often carry a fact in technical prose, so they pass.
# Source: Williams and Bizup, "Style: Lessons in Clarity and Grace", the lesson
# "Concision", on intensifiers and hedges.
extends: sequence
message: "'%[1]s %[2]s': pick one stronger verb instead of an adverb and a verb."
level: suggestion
ignorecase: true
tokens:
  - pattern: \b(?:highly|greatly|heavily|deeply|strongly|significantly|substantially|extremely|really|totally|completely|truly|vastly|seriously|dramatically|radically|largely)\b
  - tag: VB|VBD|VBG|VBN|VBP|VBZ
tests:
  - name: flags a degree adverb before a verb
    input: The cache heavily relies on the disk. We really need it.
    contains:
      - "'heavily relies'"
      - "'really need'"
  - name: leaves a stronger verb and a manner adverb alone
    input: >
      The cache depends on the disk. Run `mise run test` to check it
      properly. The flag is correctly set.
    want: ''
