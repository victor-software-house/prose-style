# A verb written as a noun ("perform an analysis of", "the handling of") needs
# a weak verb to carry it. Use the verb. Voices.WeakVerbs already covers "make
# a decision", so this rule leaves that phrase out.
# Source: Williams and Bizup, "Style: Lessons in Clarity and Grace", the
# lesson "Clarity: Actions", on nominalizations.
extends: existence
message: "'%s' hides the action in a noun: use the verb itself, such as 'analyze' for 'perform an analysis of'."
level: suggestion
ignorecase: true
tokens:
  - '(?:make|makes|made|making|perform|performs|performed|performing|conduct|conducts|conducted|conducting|carry out|carries out|carried out|carrying out|provide|provides|provided|providing|give|gives|gave|giving) an? (?:analysis|assessment|calculation|comparison|description|determination|evaluation|examination|explanation|improvement|investigation|modification|replacement|review|selection|validation|verification)\b'
  - 'make(?:s|ing)? use of\b|made use of\b'
  - '\bthe (?:addition|application|configuration|construction|creation|definition|deletion|detection|enforcement|execution|generation|handling|implementation|inclusion|installation|integration|introduction|removal|resolution|termination|use) of\b'
tests:
  - name: flags a verb written as a noun
    input: >
      We perform an analysis of the log. The implementation of the parser is
      slow. We made use of `jq`.
    contains:
      - "'perform an analysis'"
      - "'The implementation of'"
      - "'made use of'"
  - name: leaves the verb, and plain nouns, alone
    input: >
      We analyze the log in `logs/run-12.txt`. We implemented the parser.
      A change to `src/lib.rs` made the build pass. Use the use case in PR #9.
    want: ''
