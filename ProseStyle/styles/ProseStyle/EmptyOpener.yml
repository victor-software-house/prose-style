# "There is ..." and "It is clear that ..." open with a stand-in subject and
# push the real one to the end. Start with the real subject and a verb.
# Source: Microsoft Writing Style Guide, "Top 10 tips for style and voice":
# "Avoid weak phrasing like there is, there are, and there were."
extends: existence
message: "'%s' opens with a stand-in subject: start with the real subject and a verb."
level: suggestion
ignorecase: true
nonword: true
scope: sentence
tokens:
  - '^There (?:is|are|was|were)\b'
  - '^It (?:is|was) (?:[A-Za-z''-]+ ){1,4}?that\b'
tests:
  - name: flags there is and it is that openers
    input: >
      There is a flaw in the plan. It is clear that the build fails.
    contains:
      - "'There is'"
      - "'It is clear that'"
  - name: leaves a real subject alone
    input: >
      The plan has a flaw. The build fails after commit abc1234. Is there a
      flaw in `Cargo.lock`?
    want: ''
