# A word typed twice in a row ("the the") is a slip. Tokens are whitespace
# separated, so a word repeated across punctuation or a code span passes.
extends: repetition
message: "'%s' is repeated: delete one."
level: warning
alpha: true
ignorecase: true
tokens:
  - '\S+'
tests:
  - name: flags a word typed twice
    input: The the build fails and fails.
    contains: "'the' is repeated"
  - name: leaves repeats across punctuation and code spans alone
    input: >
      Run `a` and `a` twice. The key: key names stay. Run 1, run 2.
      Use PR #12 and #12 or 10k and 10k.
    want: ''
