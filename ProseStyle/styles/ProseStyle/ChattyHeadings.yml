# A heading names a topic. A pronoun or a question word makes it read like
# chat: "Use it", "What it turns on", "How it works", "Let's begin".
# OpenSpec's proposal template requires "Why" and "What Changes", so those
# two headings, exactly, pass.
extends: existence
message: "'%s' in a heading reads like chat: use a noun, such as Setup, Styles or Development."
level: warning
scope: heading
ignorecase: true
tokens:
  - '\b(?:it|its|you|your|we|our|us)\b'
  - '^(?:What(?! Changes$)|How|Why(?!$)|Where|When|Here''s|Let''s)\b'
tests:
  - name: flags pronoun and question headings
    input: |
      # Use it

      Text.

      ## What it turns on

      Text.

      ## How to install

      Text.
    contains:
      - "'it'"
      - "'What'"
      - "'How'"
  - name: leaves the OpenSpec proposal headings alone
    input: |
      ## Why

      Text.

      ## What Changes

      Text.
    want: ''
  - name: flags question words beyond the OpenSpec headings
    input: |
      ## Why this matters

      Text.

      ## What changes here

      Text.
    contains:
      - "'Why'"
      - "'What'"
  - name: leaves noun headings alone
    input: |
      # Setup

      Text.

      ## Styles

      Text.
    want: ''
