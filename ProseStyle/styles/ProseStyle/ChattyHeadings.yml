# A heading names a topic. A pronoun or a question word makes it read like
# chat: "Use it", "What it turns on", "How it works", "Let's begin". A vague noun such as "Piece" names no topic.
# An OpenSpec requirement or scenario title is a sentence about its subject, so
# "Scenario: Incus keeps its own dnsmasq" passes it and its. You and we still fail.
# OpenSpec's "Why" and "What Changes" fail anywhere but the proposal.md of a
# change, which the package's settings skip: OpenSpec requires them there.
extends: existence
message: "'%s' in a heading reads like chat: use a noun, such as Setup, Styles or Development."
level: error
scope: heading
ignorecase: true
tokens:
  - '(?<!^(?:Requirement|Scenario):.*)\b(?:it|its)\b'
  - '\b(?:you|your|we|our|us)\b'
  - '^(?:What|How|Why|Where|When|Here''s|Let''s)\b'
  - '^(?:Pieces?|Things?|Stuff|Misc)$'
tests:
  - name: flags pronoun and question headings
    input: |
      # Use it

      Text.

      ## What it turns on

      Text.

      ## How to install

      Text.
    contains:
      - "'it'"
      - "'What'"
      - "'How'"
  - name: leaves noun headings alone
    input: |
      # Setup

      Text.

      ## Styles

      Text.
    want: ''
  - name: flags a vague noun heading
    input: |
      # Piece

      Text.
    contains: "'Piece'"
  - name: leaves it in an OpenSpec scenario title alone
    input: |
      #### Scenario: Incus keeps its own dnsmasq

      Text.

      ### Requirement: An alias resolves to the device that serves it

      Text.
    want: ''
  - name: flags you in an OpenSpec scenario title
    input: |
      #### Scenario: You restart the host

      Text.
    contains: "'You'"
