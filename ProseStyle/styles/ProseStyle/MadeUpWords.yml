# A compound coined from a hyphen chain: one carrying "versus", or a chain of
# three or more parts turned into a noun with -ness or -ity. Two parts pass:
# "source-integrity" and "high-quality" join real words. MadeUpNouns checks a
# single -ness or -ity word against the dictionary. A chain that ends in a
# common word, such as pi-test-harness or color-blindness, is a name and passes.
# Matched by case, a capital only first, so an all-caps code such as
# M-INITIAL-CAPACITY is not a word.
extends: existence
message: "'%s' is a made-up word: say it in plain words."
level: error
nonword: true
exceptions:
  - '^[\w-]*-(?:harness|business|witness|blindness|awareness|readiness|opportunity|quality|security|identity|priority|capacity|availability|community|activity|entity|utility|authority|compatibility)$'
tokens:
  - '\b[A-Za-z][a-z]*(?:-[a-z]+)*-(?:versus|vs)-[a-z]+(?:-[a-z]+)*\b'
  - '\b[A-Za-z][a-z]*(?:-[a-z]+)+-[a-z]*(?:ness|ity)\b'
  - '\b[A-Za-z][a-z]*(?:-[a-z]+)*-(?:ness|ity)\b'
tests:
  - name: flags made-up words
    input: A top-to-bottomness check and a bullets-versus-numbered-paragraphs rule.
    contains:
      - "'top-to-bottomness'"
      - "'bullets-versus-numbered-paragraphs'"
  - name: flags a made-up word at the start of a sentence
    input: Top-to-bottomness is the goal.
    contains:
      - "'Top-to-bottomness'"
  - name: flags a bare suffix part
    input: Its determinism-ness is the goal.
    contains: "'determinism-ness'"
  - name: flags a coined chain that holds a common word
    input: Its top-quality-ness is the goal.
    contains: "'top-quality-ness'"
  - name: leaves all-caps codes alone
    input: The M-INITIAL-CAPACITY and API-VS-CLI codes stay.
    want: ''
  - name: leaves real compounds alone
    input: End-to-end tests, source-integrity checks, the native-harness runner, the pi-test-harness package, opponent-process-color-blindness and a read-only view stay.
    want: ''
