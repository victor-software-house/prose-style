extends: existence
message: "Name and link the source of '%s', or cut the claim."
level: error
ignorecase: true
tokens:
  - experts agree
  - industry reports suggest
  - many argue
  - widely regarded as
  - studies show

tests:
  - name: fires
    input: |
      Experts agree it works.
    want: |
      1:1:ProseStyle.VagueAttribution:Name and link the source of 'Experts agree', or cut the claim.
  - name: clean
    input: |
      The benchmark shows it works.
    want: ""
