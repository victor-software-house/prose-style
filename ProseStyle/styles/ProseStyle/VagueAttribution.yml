extends: existence
message: "Cite the source of '%s' with a link, or cut the claim."
level: error
ignorecase: true
tokens:
  - experts agree
  - industry reports suggest
  - many argue
  - widely regarded as
  - studies show

tests:
  - name: fires
    input: |
      Experts agree it works.
    want: |
      1:1:ProseStyle.VagueAttribution:Cite the source of 'Experts agree' with a link, or cut the claim.
  - name: clean
    input: |
      The benchmark shows it works.
    want: ""
