# Taken from `errata-ai/Microsoft` (MIT). See `NOTICE`.
#
# It uses Microsoft's token set, the larger one with `I'd`, `I'll` and `I've`.
# It adds the lookaround that both packages came to use.
# Matching the space around `I` made the alert span too wide in editors.
# And `nonword` would block a project's own vocabulary.
extends: existence
message: "Replace '%s' with the subject."
level: suggestion
ignorecase: true
tokens:
  - '(?<=^|\s)I(?=[\s,])'
  - "\\bI'd\\b"
  - "\\bI'll\\b"
  - "\\bI'm\\b"
  - "\\bI've\\b"
  - \bme\b
  - \bmy\b
  - \bmine\b
tests:
  - name: fires
    input: >
      I think you should restart. My preference is TLS, and I'll explain why.
    want: |
      1:1:ProseStyle.FirstPersonSingular:Replace 'I' with the subject.
      1:29:ProseStyle.FirstPersonSingular:Replace 'My' with the subject.
      1:55:ProseStyle.FirstPersonSingular:Replace 'I'll' with the subject.

  - name: clean
    input: >
      You should restart. TLS is preferred.
    want: ""
