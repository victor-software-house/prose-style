# Extracted from errata-ai/Microsoft (MIT). See NOTICE.
#
# Microsoft's token set (the superset: I'd, I'll, I've) with the lookaround
# refinement both packages converged on -- consuming the space around 'I' made
# the alert span too wide in editors, and `nonword` would block project Vocabs.
extends: existence
message: "Replace '%s' with the subject."
level: suggestion
ignorecase: true
tokens:
  - '(?<=^|\s)I(?=[\s,])'
  - "\\bI'd\\b"
  - "\\bI'll\\b"
  - "\\bI'm\\b"
  - "\\bI've\\b"
  - \bme\b
  - \bmy\b
  - \bmine\b
tests:
  - name: fires
    input: >
      I think you should restart. My preference is TLS, and I'll explain why.
    want: |
      1:1:ProseStyle.FirstPersonSingular:Replace 'I' with the subject.
      1:29:ProseStyle.FirstPersonSingular:Replace 'My' with the subject.
      1:55:ProseStyle.FirstPersonSingular:Replace 'I'll' with the subject.

  - name: clean
    input: >
      You should restart. TLS is preferred.
    want: ""
