# Things hold, show, mark, fetch and match. Only people say, tell, know, want
# or ask. This matches the pronouns it, both and which right before the verb;
# ThingsSpeakNoun matches nouns. "They" passes: in docs it names people, as in
# "ask the user if they want". "Tells them apart" is a plain verb and passes.
extends: existence
message: "'%s' gives a thing speech or thought: name what it holds, shows, marks or matches."
level: error
ignorecase: true
tokens:
  - '(?:it|both|which) (?:says?|said|(?:tells?|told)(?! (?:\w+ ){0,2}apart\b)|knows?|knew|thinks?|wants?|agrees?|asks?|asked)\b'
  - '\bsays so\b'
  - 'as far as it agrees'
tests:
  - name: flags a pronoun for a thing that speaks or thinks
    input: |
      Both say "record type". The state is open and it knows its names.

      The request is large, and which asks for the rows is unclear.
    contains:
      - "'Both say'"
      - "'it knows'"
      - "'which asks'"
  - name: leaves people and literal verbs alone
    input: The operator said to keep it. The file holds the rows, and the log shows the wait.
    want: ''
  - name: leaves they and telling apart alone
    input: Ask the user if they want a fix. The filter tells them apart by source.
    want: ''
