# Things hold, show, mark, fetch and match. Only people say, tell, know, want
# or ask. This matches the pronouns it, both, they and which right before the
# verb; ThingsSpeakNoun matches nouns.
extends: existence
message: "'%s' gives a thing speech or thought: name what it holds, shows, marks or matches."
level: warning
ignorecase: true
tokens:
  - '(?:it|both|they|which) (?:says?|said|tells?|told|knows?|knew|thinks?|wants?|agrees?|asks?|asked)\b'
  - '\bsays so\b'
  - 'as far as it agrees'
tests:
  - name: flags a pronoun for a thing that speaks or thinks
    input: |
      Both say "record type". The state is open and it knows its names.

      The request is large, and which asks for the rows is unclear.
    contains:
      - "'Both say'"
      - "'it knows'"
      - "'which asks'"
  - name: leaves people and literal verbs alone
    input: The operator said to keep it. The file holds the rows, and the log shows the wait.
    want: ''
