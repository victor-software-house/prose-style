# A bare PR, MR, ticket or ledger code names nothing a reader knows, whatever
# its number of digits. Say what it is, and link it. A code in link text, in a
# code span or in a fenced block passes, and so does a standard name such as
# SHA-256, DNS-01 or UTC-3.
# A script reads the file once. A regex with a fence lookbehind rescanned the
# file from the top at each code: 64 s on a file of 8,000 codes.
extends: existence
message: "Bare reference '%s': write what it points to, such as pull request or ticket, and link it."
level: error
scope: text & ~code & ~link
raw:
  - '(?<![\[\w/`#&-])(?!(?:SHA|UTF|ISO|RFC|CVE|AES|TLS|HTTP|DNS|UTC|GMT|IPv|W)-)(?:#\d{2,5}|![1-9]\d{1,4}|[A-Z][A-Z0-9]{1,6}-\d+)(?![\w\]`-])'
tests:
  - name: flags PR, ticket and MR codes
    input: 'See PR #123, EVO-9673, and !294 for details.'
    contains:
      - "'#123'"
      - "'EVO-9673'"
      - "'!294'"
  - name: leaves codes in links and backticks, and standard names
    input: Use `QCTL-006`, [PR 40](https://example.com/pull/40), SHA-256, UTF-8, ACME DNS-01 and UTC-3.
    want: ''
  - name: leaves a code inside a longer code span alone
    input: |
      The squash subject is `feat: fix the parser (#12)`, and ``chore: bump (ABC-34)`` too.

      | Subject | Use |
      |:--|:--|
      | `chore(release): version packages (#42)` | auto-merge |
    want: ''
  - name: leaves codes in fenced blocks and front matter alone
    input: |
      ---
      adr: ADR-0004
      ---

      Read EVO-9673.

      ```css
      a { color: #333; }
      ```
    want: |
      5:6:ProseStyle.BareWorkItem:Bare reference 'EVO-9673': write what it points to, such as pull request or ticket, and link it.
  - name: flags a code with one digit
    input: 'See QCTL-6 and VER-117 for details.'
    contains:
      - "'QCTL-6'"
      - "'VER-117'"
  - name: flags a code after a closed code span
    input: 'Run `make` and then read PR #123 and EVO-9673 today.'
    contains:
      - "'#123'"
      - "'EVO-9673'"
