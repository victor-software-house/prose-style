# A bare PR, MR, ticket or ledger code names nothing a reader knows.
# Write what it points to, and link it. Raw scope, so a code in link
# text or in backticks passes. Standard names such as SHA-256, UTF-8, DNS-01 and UTC-3 pass.
# A code inside a longer code span, such as `feat: fix the parser (#12)`, is
# code too. The lookahead in front runs the span check only where a code
# starts; the span check is the one BareURL uses, pairing backtick runs on the
# line as CommonMark does. The fence lookbehind is BareURL's too: a code
# inside a fenced block, such as a JSON example, is code.
extends: existence
message: "Bare reference '%s': write what it points to, such as pull request or ticket, and link it."
level: error
scope: raw
nonword: true
tokens:
  - '(?<![\[\w/`#&-])(?!(?:SHA|UTF|ISO|RFC|CVE|AES|TLS|HTTP|DNS|UTC|GMT|IPv|W)-)(?=(?:#\d{2,5}|![1-9]\d{1,4}|[A-Z][A-Z0-9]{1,6}-\d{2,5})(?![\w\]`-]))(?<!\A(?:(?:(?![ \t]*(?:```|~~~))[^\n]*\n)*(?:[ \t]*(?:```|~~~)[^\n]*\n)(?:(?![ \t]*(?:```|~~~))[^\n]*\n)*(?:[ \t]*(?:```|~~~)[^\n]*\n))*(?:(?![ \t]*(?:```|~~~))[^\n]*\n)*(?:[ \t]*(?:```|~~~)[^\n]*\n)(?:(?![ \t]*(?:```|~~~))[^\n]*\n)*[^\n]*)(?!(?<=(?:\A|\n)(?:(?:[^`\n]|\\`|(?<![`\\])`(?!`)(?![^\n]*?(?<!`)`(?!`))|(?<![`\\])``(?!`)(?![^\n]*?(?<!`)``(?!`))|(?<![`\\])```(?!`)(?![^\n]*?(?<!`)```(?!`))|(?<!`)`{4,}(?!`))|(?:(?<![`\\])`(?!`)(?:[^`\n]|(?<!`)`{2,}(?!`))*(?<!`)`(?!`)|(?<![`\\])``(?!`)(?:[^`\n]|(?<!`)`{1,1}(?!`)|(?<!`)`{3,}(?!`))*(?<!`)``(?!`)|(?<![`\\])```(?!`)(?:[^`\n]|(?<!`)`{1,2}(?!`)|(?<!`)`{4,}(?!`))*(?<!`)```(?!`)))*(?<![`\\])`(?!`)(?:[^`\n]|(?<!`)`{2,}(?!`))*)(?=[^\n]*?(?<!`)`(?!`))|(?<=(?:\A|\n)(?:(?:[^`\n]|\\`|(?<![`\\])`(?!`)(?![^\n]*?(?<!`)`(?!`))|(?<![`\\])``(?!`)(?![^\n]*?(?<!`)``(?!`))|(?<![`\\])```(?!`)(?![^\n]*?(?<!`)```(?!`))|(?<!`)`{4,}(?!`))|(?:(?<![`\\])`(?!`)(?:[^`\n]|(?<!`)`{2,}(?!`))*(?<!`)`(?!`)|(?<![`\\])``(?!`)(?:[^`\n]|(?<!`)`{1,1}(?!`)|(?<!`)`{3,}(?!`))*(?<!`)``(?!`)|(?<![`\\])```(?!`)(?:[^`\n]|(?<!`)`{1,2}(?!`)|(?<!`)`{4,}(?!`))*(?<!`)```(?!`)))*(?<![`\\])``(?!`)(?:[^`\n]|(?<!`)`{1,1}(?!`)|(?<!`)`{3,}(?!`))*)(?=[^\n]*?(?<!`)``(?!`))|(?<=(?:\A|\n)(?:(?:[^`\n]|\\`|(?<![`\\])`(?!`)(?![^\n]*?(?<!`)`(?!`))|(?<![`\\])``(?!`)(?![^\n]*?(?<!`)``(?!`))|(?<![`\\])```(?!`)(?![^\n]*?(?<!`)```(?!`))|(?<!`)`{4,}(?!`))|(?:(?<![`\\])`(?!`)(?:[^`\n]|(?<!`)`{2,}(?!`))*(?<!`)`(?!`)|(?<![`\\])``(?!`)(?:[^`\n]|(?<!`)`{1,1}(?!`)|(?<!`)`{3,}(?!`))*(?<!`)``(?!`)|(?<![`\\])```(?!`)(?:[^`\n]|(?<!`)`{1,2}(?!`)|(?<!`)`{4,}(?!`))*(?<!`)```(?!`)))*(?<![`\\])```(?!`)(?:[^`\n]|(?<!`)`{1,2}(?!`)|(?<!`)`{4,}(?!`))*)(?=[^\n]*?(?<!`)```(?!`)))(?:#\d{2,5}|![1-9]\d{1,4}|[A-Z][A-Z0-9]{1,6}-\d{2,5})(?![\w\]`-])'
tests:
  - name: flags PR, ticket and MR codes
    input: 'See PR #123, EVO-9673, and !294 for details.'
    contains:
      - "'#123'"
      - "'EVO-9673'"
      - "'!294'"
  - name: leaves codes in links and backticks, and standard names
    input: Use `QCTL-006`, [PR 40](https://example.com/pull/40), SHA-256, UTF-8, ACME DNS-01 and UTC-3.
    want: ''
  - name: leaves a code inside a longer code span alone
    input: |
      The squash subject is `feat: fix the parser (#12)`, and ``chore: bump (ABC-34)`` too.

      | Subject | Use |
      |:--|:--|
      | `chore(release): version packages (#42)` | auto-merge |
    want: ''
  - name: leaves a code in a fenced block alone
    input: |
      Post the body:

      ```json
      {"title": "PR Review #123"}
      ```

      Then read EVO-9673.
    want: |
      7:11:ProseStyle.BareWorkItem:Bare reference 'EVO-9673': write what it points to, such as pull request or ticket, and link it.
  - name: flags a code after a closed code span
    input: 'Run `make` and then read PR #123 and EVO-9673 today.'
    contains:
      - "'#123'"
      - "'EVO-9673'"
