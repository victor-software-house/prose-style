extends: existence
message: "Replace '%s' with the subject."
level: suggestion
ignorecase: true
tokens:
  - we
  - we'(?:ve|re)
  - ours?
  - us
  - let's
tests:
  - name: fires
    input: >
      We recommend restarting. Let's begin, and the choice is ours.
    want: |
      1:1:ProseStyle.FirstPersonPlural:Replace 'We' with the subject.
      1:26:ProseStyle.FirstPersonPlural:Replace 'Let's' with the subject.
      1:57:ProseStyle.FirstPersonPlural:Replace 'ours' with the subject.

  - name: clean
    input: >
      Restarting is recommended.
    want: ""
