#
extends: existence
message: "Replace '%s' with the name of who acts."
level: suggestion
ignorecase: true
tokens:
  - we
  - we'(?:ve|re)
  - ours?
  - us
  - let's
tests:
  - name: fires
    input: >
      We recommend restarting. Let's begin, and the choice is ours.
    want: |
      1:1:ProseStyle.FirstPersonPlural:Replace 'We' with the name of who acts.
      1:26:ProseStyle.FirstPersonPlural:Replace 'Let's' with the name of who acts.
      1:57:ProseStyle.FirstPersonPlural:Replace 'ours' with the name of who acts.

  - name: clean
    input: >
      Restarting is recommended.
    want: ""
