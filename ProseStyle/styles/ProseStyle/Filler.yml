# Words that add tone and no content.
extends: existence
message: "Filler '%s': cut it."
level: warning
ignorecase: true
exceptions:
  - just in time
  - just as
  - just now
tokens:
  - simply
  - just
  - easy
  - easily
  - obviously
  - basically
  - essentially
  - of course
  - needless to say
  - it goes without saying
tests:
  - name: flags filler
    input: Simply run it. It is basically done.
    contains:
      - "'Simply'"
      - "'basically'"
  - name: leaves text without filler alone
    input: Run it. It is done.
    want: ''
  - name: flags just and easy
    input: Just run the tests. The setup is easy.
    contains:
      - "'Just'"
      - "'easy'"
  - name: leaves just in time alone
    input: The job runs just in time, just as planned.
    want: ''
