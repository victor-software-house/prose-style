# Documentation reads serious and formal, in the terms experts use. Slang reads like chat.
extends: existence
message: "Slang '%s': use a plain, formal word."
level: warning
ignorecase: true
tokens:
  - gonna
  - wanna
  - gotta
  - kinda
  - sorta
  - lemme
  - dunno
  - yeah
  - yep
  - nope
  - nah
  - lol
  - tbh
  - btw
  - awesome
  - legit
  - nuke[sd]?
  - hacky
  - janky
  - sketchy
  - gotcha
  - bonkers
  - meh
  - dude
  - sucks
  - no-brainer
  - a ton of
  - a bunch of
tests:
  - name: flags slang
    input: It's gonna be awesome, and that hack is janky. Nope.
    contains:
      - "'gonna'"
      - "'awesome'"
      - "'janky'"
      - "'Nope'"
  - name: leaves formal words alone
    input: The cache is expected to improve latency. A guide covers the hack in `legit.rs`.
    want: ''
