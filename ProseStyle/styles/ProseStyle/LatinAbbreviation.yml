# Taken from `errata-ai/Google` and `errata-ai/IBM` (MIT). See `NOTICE`.
#
# It uses Google's boundary style over the longer list from `errata-ai/IBM`.
# The lookahead leaves the next comma or space out of the match.
# And `$` catches an abbreviation at the end of a heading or a table cell.
extends: substitution
message: "Write '%s' instead of '%s'."
level: suggestion
ignorecase: true
nonword: true
action:
  name: replace
swap:
  '\b(?:eg|e\.g\.)(?=[\s,;]|$)': for example
  '\b(?:ie|i\.e\.)(?=[\s,;]|$)': that is
  '\betc\.(?=[\s,;]|$)': and so on
  '\bvs\.(?=[\s,;]|$)': versus
tests:
  - name: fires
    input: >
      Use a tunnel, e.g. SSH, for internal services, i.e. anything private, etc.
    want: |
      1:15:ProseStyle.LatinAbbreviation:Write 'for example' instead of 'e.g.'.
      1:48:ProseStyle.LatinAbbreviation:Write 'that is' instead of 'i.e.'.
      1:71:ProseStyle.LatinAbbreviation:Write 'and so on' instead of 'etc.'.

  - name: clean
    input: >
      Use a tunnel, for example SSH, for internal services.
    want: ""