extends: existence
message: "Cut '%s'."
level: error
ignorecase: true
tokens:
  - 'the reason (?:that |why )?[\w\s]{0,20} is'
  - what this means is
  - "in this (?:article|post|section)"

tests:
  - name: fires
    input: |
      What this means is that it works.
    want: |
      1:1:ProseStyle.Preamble:Cut 'What this means is'.
  - name: clean
    input: |
      It works.
    want: ""
