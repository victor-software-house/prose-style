# A reader meets an acronym with no definition. Write "pull request (PR)" before the bare "PR".
# The exception list holds acronyms a reader of technical prose knows, network, cloud and security terms included;
# a project adds its own, such as a product name, to its vocabulary.
# The prefix of a work-item code such as VER-117 is a name, not an acronym to spell out.
# Source: Google developer documentation style guide, "Abbreviations".
extends: conditional
message: "Spell out '%s' on first use, as in 'pull request (PR)'."
level: suggestion
ignorecase: false
first: '\b([A-Z]{2,6})\b(?!-\d)'
second: '(?:\b[A-Za-z][\w-]*[ ]){1,6}\(([A-Z]{2,6})\)|\b([A-Z]{2,6})\b \((?:[A-Za-z][\w-]*[ ]?){1,6}\)'
exceptions:
