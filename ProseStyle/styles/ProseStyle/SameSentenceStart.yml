# Three sentences in a row that open with one word read as a template.
# Agent docs hit this 4.9 times as often as human design docs. The script reads paragraphs, so list items pass.
extends: existence
message: "Three sentences in a row open with '%s': change the opening of one."
level: warning
scope: paragraph
ignorecase: true
raw:
  - '(?<![\w''-])(?<=^|[.!?]\s|[.!?]["'')\]]\s)([A-Za-z][A-Za-z''-]*)\b(?=[^.!?]*[.!?]+["'')\]]*\s+\1\b[^.!?]*[.!?]+["'')\]]*\s+\1\b)'
tests:
  - name: flags three sentences that open with one word
    input: >
      The worker reads the cache. The cache holds one file. The file keeps
      one record.
    contains: "open with 'The'"
  - name: leaves varied openings and list items alone
    input: |
      The worker reads the cache. A file holds one record. The daemon writes
      the log.

      - Use the tool.
      - Use the flag.
      - Use more.
    want: ''
