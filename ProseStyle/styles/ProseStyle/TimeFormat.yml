extends: existence
message: "Use one time format throughout the file."
level: suggestion
nonword: true
tokens:
  - '\d{1,2}[AP]M\b'
  - '\d{1,2} ?[ap]m\b'
  - '\d{1,2} ?[aApP]\.[mM]\.'
tests:
  - name: fires
    input: >
      The job runs at 5PM and again at 6 am, then at 7 a.m.
    want: |
      1:17:ProseStyle.TimeFormat:Use one time format throughout the file.
      1:34:ProseStyle.TimeFormat:Use one time format throughout the file.
      1:48:ProseStyle.TimeFormat:Use one time format throughout the file.

  - name: clean
    input: >
      The job runs at 5 PM and again at 6 AM.
    want: ""
