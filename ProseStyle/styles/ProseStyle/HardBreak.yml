# A line end inside a paragraph renders as a space, so the paragraph flows on the page.
# Two trailing spaces force a break, which shows each sentence on its own line.
# The rule reads Markdown only: a comment in code or config is not Markdown.
extends: existence
message: "Delete the trailing spaces."
level: suggestion
scope: text.md
raw:
  - '[^ \n] {2,}(?=\r?\n[ \t]*\S)'
tests:
  - name: flags two trailing spaces inside a paragraph
    input: "First line of a paragraph.  \nSecond line of it.\n"
    contains: "Delete the trailing spaces."
  - name: leaves plain line ends, list items, tables and fences alone
    input: "First line of a paragraph.\nSecond line of it.\n\n- item one\n- item two\n\n| a | b |\n|:--|:--|\n\n```\ncode  \nmore\n```\n"
    want: ''
  - name: leaves trailing spaces before a blank line alone
    input: "Last line of a paragraph.  \n\nNext paragraph.\n"
    want: ''
