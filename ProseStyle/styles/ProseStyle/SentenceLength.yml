# Derived from the Direct voice of Vale Voices and the SentenceLength rule of `errata-ai/IBM` (MIT).
# See `NOTICE`.
#
# A sentence over 25 words is a hint.
# So a sentence over 40 words gets this suggestion and LongSentence too.
# The message shows the count of words, and leaves out the limit.
extends: occurrence
message: "Split this %d-word sentence."
level: suggestion
scope: sentence
max: 25
token: \b(\w+)\b
tests:
  - name: fires
    input: |
      When you have finished the installation and confirmed that the service starts, open the settings page and choose the account you want to connect, and then paste the token.
    want: |
      1:1:ProseStyle.SentenceLength:Split this 29-word sentence.
  - name: clean
    input: |
      Open the settings page. Choose the account.
    want: ""
