extends: existence
message: "Cut '%s', or state the effect."
level: error
ignorecase: true
nonword: true
tokens:
  - ',\s+(?:highlighting|underscoring|reflecting|showcasing|demonstrating)\b'

tests:
  - name: fires
    input: |
      Sales rose, highlighting demand.
    want: |
      1:11:ProseStyle.SuperficialAnalysis:Cut ', highlighting', or state the effect.
  - name: clean
    input: |
      Sales rose because demand did.
    want: ""
