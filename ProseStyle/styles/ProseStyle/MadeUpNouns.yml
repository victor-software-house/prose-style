# A noun made up with `-ness` or `-ity`, such as `greppability` or `skimmability`, has no meaning a reader knows.
# Say what someone can do with it.
#
# The rule checks each word that ends in `-ness` or `-ity` against Vale's `en_US` dictionary and skips every other word.
# A project adds a real term, such as a database's `linearizability`, to its vocabulary.
#
# The filter is RE2.
# It matches the words to skip: those with another ending, and words of four letters or fewer.
extends: spelling
message: "Replace '%s' with a common word."
level: error
filters:
  - '(?i)^(?:.*[^sy]|.*[^s]s|.*[^e]ss|.*[^n]ess|.*[^t]y|.*[^i]ty|.{1,4})$'
tests:
  - name: flags coined -ness and -ity nouns
    input: Its greppability and skimmability are high, and so is its swappability.
    contains:
      - "'greppability'"
      - "'skimmability'"
      - "'swappability'"
  - name: leaves dictionary words alone
    input: The harness checks integrity, readiness, observability and the business rules. A tpyo elsewhere passes.
    want: ''