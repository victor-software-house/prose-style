# A tracked document says what it means in plain words. Profanity marks a pasted
# chat message.
extends: existence
message: "Profanity '%s' marks a pasted chat message: say what you mean in plain words."
level: error
ignorecase: true
tokens:
  - 'fuck\w*'
  - 'shit\w*'
  - 'damn\w*'
  - dammit
  - wtf
  - bullshit
  - crap\w*
  - goddamn\w*
  - wth
  - ffs
  - piss\w*
tests:
  - name: flags profanity
    input: Stop the damn retries, wtf.
    contains:
      - "'damn'"
      - "'wtf'"
  - name: leaves a polite request alone
    input: Stop the retries after three attempts.
    want: ''
  - name: flags more profanity
    input: This is crap. What the wth.
    contains:
      - "'crap'"
      - "'wth'"
