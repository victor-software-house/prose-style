# Link text names its target, so a reader who scans the links learns where each goes.
# An example in a code span, such as `[here](…)` or `A [link](x) here`, passes:
# the token matches only after an even number of backticks on its line.
extends: existence
message: "Link text '%s' names nothing: use a few words that name the target."
level: error
ignorecase: true
nonword: true
scope: raw
tokens:
  - '(?m)(?<!`)(?<=^[^`\n]*(?:`[^`\n]*`[^`\n]*)*)\[(?:here|this|link|this link|click here|read more|more|page|this page)\](?:\(|\[)'
tests:
  - name: flags vague link text
    input: See [here](https://example.com/a) and [this link][ref] and `x` then [more](b.md).
    contains:
      - "'[here]("
      - "'[this link]["
      - "'[more]("
  - name: leaves named link text alone
    input: See [the Vale testing guide](https://vale.sh/docs/testing) and [PR 12][pr]. Do not write `[here](…)`. The input `A **bold** [link](https://a.example) here.` parses, and so does ``[here](x)``.
    want: ''
