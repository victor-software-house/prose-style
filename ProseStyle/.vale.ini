# Read by Vale before the project's own .vale.ini.
StylesPath = styles

# Std comes after Voices: its pinned release replaces the latest one Voices names.
Packages = https://github.com/jdkato/voices/releases/download/v0.2.0/Voices.zip, https://github.com/vale-cli/Std/releases/download/v0.2.0/Std.zip, https://github.com/vale-cli/Readability/releases/download/v0.2.0/Readability.zip

[*.{md,mdx,txt}]
BasedOnStyles = ProseStyle, Direct

# A label and a colon starts a list item here ("Cause: ...").
Voices.ColonReveal = NO

# Direct.Length warns at 25 words; ProseStyle.LongSentence fails at 40.
Direct.Length = warning
# Reading ease per paragraph fires on every one-line technical paragraph.
Direct.Ease = NO

# The grade, as a score per file.
Readability.FleschKincaid = suggestion

# Plain words and spacing from Std. Its other rules do not fit technical docs.
Std.Abbreviations.Latin = suggestion
Std.Punctuation.Spacing = suggestion
Std.Usage.GenderedPronouns = suggestion
Std.Usage.GenderedTerms = suggestion

# An OpenSpec change describes a change, so words about time belong there.
[**/openspec/changes/**/*.md]
ProseStyle.StaleTime = NO
