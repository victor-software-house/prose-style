# Builds the zip, then runs every rule's cases and the package cases on it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: victor-software-house/actions/mise@c5ea40a355cb9e5ae9429827ccc1048d333c23b1 # main, 2026-11-09
        with:
          version: 2026.11.2
          mirror-token: ${{ secrets.RELEASE_MIRROR_TOKEN }}
      - name: Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run test
