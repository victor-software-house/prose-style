# A tag v0.0.N on main publishes ProseStyle.zip, the asset projects pin in
# their Packages list, and PullRequestStyle.zip, which the organization's pull
# request check reads after it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
      # The mise action exchanges it for the mirror's session token.
      id-token: write
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: victor-software-house/actions/mise@4168002fe58fd0b310bd2b65f9db2262fc0e21d3 # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
          version: 2026.11.6
      - name: Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run test
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          gh release create "$TAG" ProseStyle.zip PullRequestStyle.zip --title "$TAG" \
            --notes "Packages = ${base}/ProseStyle.zip"
