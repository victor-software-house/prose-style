# A tag v0.0.N on main publishes ProseStyle.zip as the release asset that
# projects pin in their Packages list.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: victor-software-house/actions/mise@e6e13c808cce87ac8f1faf59cfaf2bab34bda7aa # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-password: ${{ secrets.RELEASE_MIRROR_CI_PASSWORD }}
          version: 2026.11.6
      - name: Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run test
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ProseStyle.zip"
          gh release create "$TAG" ProseStyle.zip --title "$TAG" --notes "Packages = $url"
