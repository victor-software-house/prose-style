# A tag v0.0.N on main publishes ProseStyle.zip as the release asset that
# projects pin in their Packages list.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.2
      - name: Test
        run: mise run test
      - name: Build
        run: mise run build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ProseStyle.zip"
          gh release create "$TAG" ProseStyle.zip --title "$TAG" --notes "Packages = $url"
