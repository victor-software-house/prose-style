# Read by Vale after ProseStyle's own config, in the job that checks a pull
# request's title and description. It touches only the two extensions that job
# writes, so a project's docs never see it. A project overrides it in
# .github/pr-prose.ini with sections for the same two extensions.
StylesPath = styles

[formats]
pr-title = md
pr-body = md

# The title: one Conventional Commit line. Its type and scope are code, so
# the prose rules read only the subject after them.
[*.pr-title]
BasedOnStyles = ProseStyle, Voices, Direct, PullRequestStyle
TokenIgnores = (\A[a-z]+(?:\([^)\s]+\))?!?:)

# ProseStyle sets these for its own file types only, so they repeat here.
Voices.ColonReveal = NO
Direct.Length = suggestion
Direct.Ease = NO

# The description, with every reference GitHub links written as a link. A
# line break renders as a break there, so no break needs two trailing spaces.
[*.pr-body]
BasedOnStyles = ProseStyle, Voices, Direct
ProseStyle.HardBreak = NO

# ProseStyle sets these for its own file types only, so they repeat here.
Voices.ColonReveal = NO
Direct.Length = suggestion
Direct.Ease = NO
